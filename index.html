<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneDrive Sorter</title>
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    button { padding: 8px 16px; cursor: pointer; }
    .controls { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
    .ok { color: #1a7f37; } .warn { color: #9a6700; } .bad { color: #cf222e; }
    #log { background: #f4f4f4; padding: 10px; height: 180px; overflow-y: scroll; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OneDrive Sorter</h1>
  <p>Governing principle: <em>Recovery First, Verification Second, Organization Third, Automation Last.</em>
     Moves only. Nothing is ever deleted, overwritten or renamed.</p>

  <div class="card">
    <h3>1. Connect OneDrive</h3>
    <div class="controls">
      <label>Azure client ID (SPA): <input id="client-id" size="40"></label>
      <button onclick="loginOneDrive()">Connect OneDrive</button>
      <span id="msal-status">Not connected</span>
    </div>
  </div>

  <div class="card">
    <h3>2. Load manifest</h3>
    <input type="file" id="manifest-file" accept=".csv" onchange="loadManifest(this.files[0])">
    <p id="manifest-summary"></p>
    <table id="plan"><thead></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h3>3. Check, then execute</h3>
    <div class="controls">
      <label for="rate-slider">Pacing delay: <span id="rate-display">1500</span>ms</label>
      <input type="range" id="rate-slider" min="500" max="5000" step="250" value="1500" oninput="updateRate(this.value)">
    </div>
    <div class="controls">
      <button onclick="runCheck()" id="btn-check" disabled>Check (dry run, read-only)</button>
      <button onclick="runExecute()" id="btn-run" disabled>Execute checked rows</button>
      <button onclick="togglePause()" id="btn-pause" disabled>Pause</button>
      <button onclick="downloadUndo()" id="btn-undo" disabled>Download undo record</button>
    </div>
  </div>

  <div class="card">
    <h3>4. Action log</h3>
    <div id="log"></div>
  </div>

<script>
// ---------- Rules v37 (Consolidated) ----------
// Top-level folders, and the allowed second-level folders where the rules define them.
const RULES = {
  "Academic": ["University Coursework", "Professional Training", "Self-Paced Learning", "Self-Directed Practice", "Academic Support Material"],
  "Career": ["Resume Workspace", "Applications", "Interviews", "Employers", "Security Clearance"],
  "Self-Paced Learning": null,
  "Professional Training": ["Revature PET", "Assessments", "Coding Labs", "Projects", "Feedback"],
  "Administrative": null,
  "Staging-Probable": null,
  "Unsorted": null
};
const REQUIRED_COLUMNS = ["SourceFile", "DestinationFolder", "Category", "SubCategory", "Confidence", "Status", "MoveAction", "Notes"];

// ---------- State ----------
let msalInstance = null, account = null;
let delayMs = 1500, rows = [], isPaused = false, running = false, cursor = 0, undoRecords = [];

function log(msg) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function updateRate(v) { delayMs = parseInt(v); document.getElementById('rate-display').textContent = v; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = path => path.split('/').filter(Boolean).map(encodeURIComponent).join('/');

// ---------- Auth ----------
try { document.getElementById('client-id').value = localStorage.getItem('clientId') || ''; } catch (e) {}
async function loginOneDrive() {
  const clientId = document.getElementById('client-id').value.trim();
  if (!clientId) return alert('Enter your Azure client ID first.');
  try { localStorage.setItem('clientId', clientId); } catch (e) {}
  try {
    msalInstance = new msal.PublicClientApplication({
      auth: { clientId, authority: 'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname }
    });
    await msalInstance.initialize();
    const r = await msalInstance.loginPopup({ scopes: ['Files.ReadWrite', 'User.Read'] });
    account = r.account;
    document.getElementById('msal-status').textContent = 'Connected as ' + account.username;
    refreshButtons();
  } catch (err) { log('OneDrive auth failed: ' + err.message); }
}
async function getToken() {
  const scopes = ['Files.ReadWrite', 'User.Read'];
  try { return (await msalInstance.acquireTokenSilent({ scopes, account })).accessToken; }
  catch (e) { return (await msalInstance.acquireTokenPopup({ scopes, account })).accessToken; }
}

// ---------- Graph helper (retries on throttling) ----------
async function graph(method, path, body) {
  for (let attempt = 0; attempt < 5; attempt++) {
    const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
      method,
      headers: { Authorization: 'Bearer ' + await getToken(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 429 || res.status === 503) {
      const wait = (parseInt(res.headers.get('Retry-After')) || 5) * 1000;
      log(`Throttled (${res.status}); waiting ${wait}ms`);
      await sleep(wait);
      continue;
    }
    return res;
  }
  throw new Error('Gave up after repeated throttling');
}

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); f = ''; out.push(row); row = [];
    } else f += c;
  }
  if (f || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}
const csvCell = v => /[",\n\r]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);

// ---------- Validation against Rules v37 ----------
function validate(r) {
  const problems = [];
  if (r.MoveAction.toUpperCase() !== 'MOVE') problems.push(`MoveAction "${r.MoveAction}" is not MOVE`);
  if (r.Status !== 'Verified') problems.push(`Status is "${r.Status}", not Verified`);
  if (!r.SourceFile) problems.push('SourceFile is empty');
  const segs = r.DestinationFolder.split('/').filter(Boolean);
  if (!segs.length) problems.push('DestinationFolder is empty');
  else if (!(segs[0] in RULES)) problems.push(`"${segs[0]}" is not a top-level folder in the rules`);
  else if (RULES[segs[0]] && segs[1] && !RULES[segs[0]].includes(segs[1]))
    problems.push(`"${segs[1]}" is not defined under ${segs[0]} in the rules`);
  if (segs.some(s => s === '..' || s === '.')) problems.push('DestinationFolder contains . or ..');
  return problems;
}

function loadManifest(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const table = parseCSV(reader.result);
    const header = table.shift().map(h => h.trim());
    const missing = REQUIRED_COLUMNS.filter(c => !header.includes(c));
    if (missing.length) { log('Manifest is missing columns: ' + missing.join(', ')); return; }
    rows = table.map((cells, i) => {
      const r = {}; header.forEach((h, j) => r[h] = (cells[j] || '').trim());
      r.problems = validate(r);
      r.destFolder = r.DestinationFolder.split('/').filter(Boolean).join('/');
      r.selected = r.problems.length === 0;
      r.state = r.problems.length ? 'needs review' : 'not checked';
      r.cls = r.problems.length ? 'warn' : '';
      r.detail = r.problems.join('; ');
      r.n = i + 1;
      return r;
    });
    undoRecords = []; cursor = 0;
    log(`Loaded ${rows.length} manifest row(s); ${rows.filter(r => r.problems.length).length} need review.`);
    render(); refreshButtons();
  };
  reader.readAsText(file);
}

function render() {
  const thead = document.querySelector('#plan thead'), tbody = document.querySelector('#plan tbody');
  thead.innerHTML = '<tr><th>Run</th><th>#</th><th>Source</th><th>Destination</th><th>Conf.</th><th>State</th><th>Detail</th></tr>';
  tbody.textContent = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = r.selected;
    cb.onchange = () => { r.selected = cb.checked; };
    const cells = [null, r.n, r.SourceFile, r.destFolder, r.Confidence, r.state, r.detail];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      if (i === 0) td.appendChild(cb); else td.textContent = v;
      if (i === 5) td.className = r.cls;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('manifest-summary').textContent =
    rows.length ? `${rows.length} rows. Rows that fail the rules are unchecked; tick one only if you accept the exception.` : '';
}
function set(r, state, cls, detail) { r.state = state; r.cls = cls; r.detail = detail || ''; render(); }
function refreshButtons() {
  document.getElementById('btn-check').disabled = !(account && rows.length) || running;
  document.getElementById('btn-run').disabled = !rows.some(r => r.state === 'ready') || running;
  document.getElementById('btn-undo').disabled = !undoRecords.length;
}

// ---------- Check (read-only dry run) ----------
async function lookup(path) {
  const res = await graph('GET', `/me/drive/root:/${enc(path)}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GET ${path} -> ${res.status}`);
  return res.json();
}
async function runCheck() {
  running = true; refreshButtons();
  log('Check started (read-only).');
  const toCreate = new Set();
  for (const r of rows) {
    if (!r.selected) continue;
    try {
      const item = await lookup(r.SourceFile);
      if (!item) { set(r, 'source not found', 'bad', 'No item with that name/path in OneDrive'); r.item = null; }
      else {
        r.item = item;
        const parent = (item.parentReference.path || '').replace(/^\/drive\/root:?\/?/, '');
        const destParent = await lookup(r.destFolder);
        if (parent === r.destFolder) set(r, 'already there', 'ok', 'Skipped');
        else if (await lookup(r.destFolder + '/' + item.name)) set(r, 'name conflict', 'bad', 'Destination already has an item with this name; will not overwrite');
        else {
          if (!destParent) toCreate.add(r.destFolder);
          set(r, 'ready', 'ok', destParent ? 'Destination exists' : 'Destination folder will be created');
        }
        r.origParent = parent;
      }
    } catch (err) { set(r, 'check failed', 'bad', err.message); }
    await sleep(Math.min(delayMs, 500));
  }
  running = false; refreshButtons();
  log('Check finished. Only rows marked "ready" will be executed.');
  if (toCreate.size) log(`Folders that will be created (missing segments only): ${[...toCreate].join(' | ')}`);
}

// ---------- Execute ----------
const folderCache = {};
async function ensureFolder(path) {
  const segs = path.split('/').filter(Boolean); let cur = '', parentId = null;
  for (const s of segs) {
    cur = cur ? cur + '/' + s : s;
    if (folderCache[cur]) { parentId = folderCache[cur]; continue; }
    let f = await lookup(cur);
    if (!f) {
      const res = await graph('POST', parentId ? `/me/drive/items/${parentId}/children` : '/me/drive/root/children',
        { name: s, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' });
      if (!res.ok) throw new Error(`Create folder ${cur} -> ${res.status}`);
      f = await res.json(); log('Created folder ' + cur);
    } else if (!f.folder) throw new Error(`"${cur}" exists but is not a folder`);
    folderCache[cur] = parentId = f.id;
  }
  return parentId;
}
async function runExecute() {
  const todo = rows.filter(r => r.selected && r.state === 'ready');
  if (!todo.length || !confirm(`Move ${todo.length} item(s)? Nothing will be deleted or overwritten.`)) return;
  running = true; isPaused = false; cursor = 0; refreshButtons();
  document.getElementById('btn-pause').disabled = false;
  await loop();
}
async function loop() {
  const todo = rows.filter(r => r.selected && r.state === 'ready');
  while (cursor < todo.length) {
    if (isPaused) { log('Paused.'); return; }
    const r = todo[cursor++];
    try {
      const destId = await ensureFolder(r.destFolder);
      const res = await graph('PATCH', `/me/drive/items/${r.item.id}`,
        { parentReference: { id: destId }, '@microsoft.graph.conflictBehavior': 'fail' });
      if (!res.ok) throw new Error(`${res.status} ${(await res.text()).slice(0, 120)}`);
      undoRecords.push({ id: r.item.id, name: r.item.name, from: r.origParent, to: r.destFolder });
      set(r, 'moved', 'ok', '');
      log(`Moved "${r.item.name}" -> ${r.destFolder}`);
    } catch (err) { set(r, 'failed', 'bad', err.message); log(`FAILED "${r.SourceFile}": ${err.message}`); }
    refreshButtons();
    await sleep(delayMs);
  }
  running = false; document.getElementById('btn-pause').disabled = true;
  const failed = rows.filter(r => r.state === 'failed');
  log(`Done. Moved ${undoRecords.length}; failed ${failed.length}.`);
  failed.forEach(r => log(`  FAILED #${r.n} ${r.SourceFile}: ${r.detail}`));
  refreshButtons();
}
function togglePause() {
  isPaused = !isPaused;
  document.getElementById('btn-pause').textContent = isPaused ? 'Resume' : 'Pause';
  if (!isPaused && running) loop();
}

// ---------- Undo record (same schema as the manifest, new location -> original folder) ----------
function downloadUndo() {
  const lines = [REQUIRED_COLUMNS.join(',')];
  undoRecords.forEach(u => lines.push([u.to + '/' + u.name, u.from, 'Undo', '', 100, 'Verified', 'MOVE', 'Reverses a move; empty DestinationFolder = OneDrive root'].map(csvCell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'undo_manifest_' + new Date().toISOString().slice(0, 19).replace(/:/g, '') + '.csv';
  a.click();
}
</script>
</body>
</html>
